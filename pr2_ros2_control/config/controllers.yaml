controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz, like ROS 1 pr2_ethercat
    # thread_priority defaults to the SCHED_FIFO maximum (like ROS 1); lock_memory defaults to true.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Not started by the launch file. Needs commanding_enabled and the joint in commanded_joints
    # (decision D20); efforts come in on /r_wrist_roll_effort_controller/commands.
    r_wrist_roll_effort_controller:
      type: effort_controllers/JointGroupEffortController

    # Not started either. Needs both wrist joints in commanded_joints (D20, D23); references
    # (control_msgs/MultiDOFCommand, velocities) on /r_wrist_velocity_controller/reference.
    r_wrist_velocity_controller:
      type: pid_controller/PidController

    # Not started either. All seven right arm joints in commanded_joints (D27); references on
    # /r_arm_velocity_controller/reference. Claims the wrist too: not together with the one above.
    r_arm_velocity_controller:
      type: pid_controller/PidController

    # Not started either. The left arm's counterpart: all seven left arm joints in commanded_joints;
    # references on /l_arm_velocity_controller/reference. Same gains as the right arm (WG used the
    # same for both); can run together with r_arm_velocity_controller (disjoint joints).
    l_arm_velocity_controller:
      type: pid_controller/PidController

    # Not started either. torso_lift_joint in commanded_joints; references (m/s) on
    # /torso_velocity_controller/reference.
    torso_velocity_controller:
      type: pid_controller/PidController

    # Not started either. Both head joints in commanded_joints; references on
    # /head_velocity_controller/reference.
    head_velocity_controller:
      type: pid_controller/PidController

joint_state_broadcaster:
  ros__parameters:
    update_rate: 100  # ROS 1 published /joint_states at 100 Hz

r_wrist_roll_effort_controller:
  ros__parameters:
    joints: [r_wrist_roll_joint]

# Provisional gains from the D23 test at max_effort_fraction 0.1 (1 Nm per wrist joint): p from WG's
# velocity config, a small integral, both clamped to that limit so the integral cannot wind up
# against it. save_i_term false: a restart (D26) clears the integral, as ROS 1's starting() did.
# Both joints are controlled together: the wrist is a differential, and a free flex lets
# one motor turn alone (roll and flex move together). Not tuned.
r_wrist_velocity_controller:
  ros__parameters:
    dof_names: [r_wrist_roll_joint, r_wrist_flex_joint]
    command_interface: effort
    reference_and_state_interfaces: [velocity]
    gains:
      r_wrist_roll_joint: {p: 4.0, i: 5.0, d: 0.0, u_clamp_max: 1.0, u_clamp_min: -1.0,
                           i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup_strategy: conditional_integration,
                           save_i_term: false}
      r_wrist_flex_joint: {p: 4.0, i: 5.0, d: 0.0, u_clamp_max: 1.0, u_clamp_min: -1.0,
                           i_clamp_max: 1.0, i_clamp_min: -1.0, antiwindup_strategy: conditional_integration,
                           save_i_term: false}

# Provisional, for the D28 tests at max_effort_fraction 0.3 (9 Nm per arm joint, 3 Nm per wrist
# joint). The output and integral clamps must match the effort fraction: conditional integration only
# stops at the controller's own clamp, so with a clamp above the hardware limit the integral would
# wind up unnoticed. For max_effort_fraction 0.1 set them to 3 Nm (arm) and 1 Nm (wrist).
# A velocity PI is a position PD on the integrated velocity reference: velocity p = position
# d, velocity i = position p. So the tuned joints use WG's arm trajectory gains (pr2_arm_controllers,
# also IAI's pr2_whole_body_controller.yaml) that way (D28): elbow, forearm roll and upper arm roll at
# WG's values; shoulder lift (p 25 for damping) and shoulder pan at a third of WG's i, as at 10 %
# effort they are limited by the clamp, not the gains. Wrist flex and roll at WG's values (at 10 %
# effort the wrist flex could not always lift the gripper). Outputs and integrals are clamped to the
# effort limit; save_i_term false so the restart before a release clears them (D26).
r_arm_velocity_controller:
  ros__parameters:
    dof_names: [r_shoulder_pan_joint, r_shoulder_lift_joint, r_upper_arm_roll_joint, r_elbow_flex_joint,
                r_forearm_roll_joint, r_wrist_flex_joint, r_wrist_roll_joint]
    command_interface: effort
    reference_and_state_interfaces: [velocity]
    gains:
      r_shoulder_pan_joint: {p: 18.0, i: 800.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                             i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                             save_i_term: false}
      r_shoulder_lift_joint: {p: 25.0, i: 400.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                              i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                              save_i_term: false}
      r_upper_arm_roll_joint: {p: 6.0, i: 1000.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                               i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                               save_i_term: false}
      r_elbow_flex_joint: {p: 4.0, i: 700.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                           i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                           save_i_term: false}
      r_forearm_roll_joint: {p: 6.0, i: 300.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                             i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                             save_i_term: false}
      r_wrist_flex_joint: {p: 4.0, i: 300.0, d: 0.0, u_clamp_max: 3.0, u_clamp_min: -3.0,
                           i_clamp_max: 3.0, i_clamp_min: -3.0, antiwindup_strategy: conditional_integration,
                           save_i_term: false}
      r_wrist_roll_joint: {p: 4.0, i: 300.0, d: 0.0, u_clamp_max: 3.0, u_clamp_min: -3.0,
                           i_clamp_max: 3.0, i_clamp_min: -3.0, antiwindup_strategy: conditional_integration,
                           save_i_term: false}

# The right arm's gains and clamps (D28), not yet tested on the left arm.
l_arm_velocity_controller:
  ros__parameters:
    dof_names: [l_shoulder_pan_joint, l_shoulder_lift_joint, l_upper_arm_roll_joint, l_elbow_flex_joint,
                l_forearm_roll_joint, l_wrist_flex_joint, l_wrist_roll_joint]
    command_interface: effort
    reference_and_state_interfaces: [velocity]
    gains:
      l_shoulder_pan_joint: {p: 18.0, i: 800.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                             i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                             save_i_term: false}
      l_shoulder_lift_joint: {p: 25.0, i: 400.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                              i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                              save_i_term: false}
      l_upper_arm_roll_joint: {p: 6.0, i: 1000.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                               i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                               save_i_term: false}
      l_elbow_flex_joint: {p: 4.0, i: 700.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                           i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                           save_i_term: false}
      l_forearm_roll_joint: {p: 6.0, i: 300.0, d: 0.0, u_clamp_max: 9.0, u_clamp_min: -9.0,
                             i_clamp_max: 9.0, i_clamp_min: -9.0, antiwindup_strategy: conditional_integration,
                             save_i_term: false}
      l_wrist_flex_joint: {p: 4.0, i: 300.0, d: 0.0, u_clamp_max: 3.0, u_clamp_min: -3.0,
                           i_clamp_max: 3.0, i_clamp_min: -3.0, antiwindup_strategy: conditional_integration,
                           save_i_term: false}
      l_wrist_roll_joint: {p: 4.0, i: 300.0, d: 0.0, u_clamp_max: 3.0, u_clamp_min: -3.0,
                           i_clamp_max: 3.0, i_clamp_min: -3.0, antiwindup_strategy: conditional_integration,
                           save_i_term: false}

# WG's trajectory gains in velocity form as for the arms (D28): velocity p = position d, velocity
# i = position p (all three tested at WG's full value). Torso from
# pr2_torso_controller.yaml (p 1e7, d 1e6; prismatic, N and m/s), head from pr2_head_controller.yaml
# (pan p 25 d 2, tilt p 100 d 3). Clamps for max_effort_fraction:=0.6, which both need: the torso
# 6000 N of 10000 N (at 0.3 it could not lift itself: about 2600 N friction both ways plus its
# weight), the head tilt 10.8 Nm of 18 Nm (at 0.3, 5.4 Nm only balanced the head's weight looking
# down, past its soft limit, so the soft limit safety could not lift it back into range). The head
# pan stays at 0.79 Nm (0.3 of 2.645 Nm): a clamp below the hardware limit cannot wind up.
# save_i_term false (D26).
torso_velocity_controller:
  ros__parameters:
    dof_names: [torso_lift_joint]
    command_interface: effort
    reference_and_state_interfaces: [velocity]
    gains:
      torso_lift_joint: {p: 1000000.0, i: 10000000.0, d: 0.0, u_clamp_max: 6000.0, u_clamp_min: -6000.0,
                         i_clamp_max: 6000.0, i_clamp_min: -6000.0, antiwindup_strategy: conditional_integration,
                         save_i_term: false}

head_velocity_controller:
  ros__parameters:
    dof_names: [head_pan_joint, head_tilt_joint]
    command_interface: effort
    reference_and_state_interfaces: [velocity]
    gains:
      head_pan_joint: {p: 2.0, i: 25.0, d: 0.0, u_clamp_max: 0.79, u_clamp_min: -0.79,
                       i_clamp_max: 0.79, i_clamp_min: -0.79, antiwindup_strategy: conditional_integration,
                       save_i_term: false}
      head_tilt_joint: {p: 3.0, i: 100.0, d: 0.0, u_clamp_max: 10.8, u_clamp_min: -10.8,
                        i_clamp_max: 10.8, i_clamp_min: -10.8, antiwindup_strategy: conditional_integration,
                        save_i_term: false}
